name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      FINAGENT_OFFLINE: "1"
      FINAGENT_HOME: ${{ runner.temp }}/alphadesk-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[test]"
      - name: Run unit and MCP integration tests
        run: pytest -q
      - name: Smoke-test all MCP tools
        run: python scripts/mcp_smoke_test.py
      - name: Build source and wheel distributions
        run: |
          python -m pip install build
          python -m build
